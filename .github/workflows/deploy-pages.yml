name: 部署到 GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 允许此工作流进行 GitHub Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置 Pages
      uses: actions/configure-pages@v4
      
    - name: 上传到 GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4